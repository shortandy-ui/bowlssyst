<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bowls Club — Availability &amp; Selection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --green-deep:#14352A;
    --green-mid:#1F4D3A;
    --green-rink:#2E6E4E;
    --green-line:#3E7C58;
    --cream:#F3EEDD;
    --card:#FBF8EE;
    --ink:#1C2621;
    --ink-soft:#4B564D;
    --brass:#B98B33;
    --brass-light:#E4C077;
    --rust:#9C4A34;
    --line:#D9D0B5;
    --white:#ffffff;
    --radius:14px;
    --shadow:0 2px 10px rgba(20,53,42,0.10), 0 1px 2px rgba(20,53,42,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(30,77,58,0.06) 1px, transparent 1px);
    background-size: 22px 22px;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:900px;margin:0 auto;padding:0 16px 60px;}
  h1,h2,h3{font-family:'Fraunces',serif;margin:0;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;}
  button{font-family:'Inter',sans-serif;cursor:pointer;border:none;}
  button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible{
    outline:3px solid var(--brass); outline-offset:2px;
  }
  input,select{
    font-family:'Inter',sans-serif;
    font-size:15px;
    padding:9px 11px;
    border-radius:8px;
    border:1.5px solid var(--line);
    background:var(--white);
    color:var(--ink);
    width:100%;
  }
  label{font-size:12.5px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:5px;}
  .field{margin-bottom:14px;}
  .btn{
    padding:10px 18px;border-radius:9px;font-weight:600;font-size:14.5px;
    transition:transform .12s ease, box-shadow .12s ease, background .15s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--green-mid);color:var(--card);}
  .btn-primary:hover{background:var(--green-deep);}
  .btn-brass{background:var(--brass);color:var(--green-deep);}
  .btn-brass:hover{background:var(--brass-light);}
  .btn-ghost{background:transparent;color:var(--green-deep);border:1.5px solid var(--green-line);}
  .btn-ghost:hover{background:rgba(30,77,58,0.08);}
  .btn-rust{background:transparent;color:var(--rust);border:1.5px solid var(--rust);}
  .btn-rust:hover{background:rgba(156,74,52,0.10);}
  .btn-sm{padding:6px 11px;font-size:13px;border-radius:7px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  /* ===== Top bar ===== */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:22px 0 14px;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-badge{
    width:42px;height:42px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--green-line), var(--green-deep) 70%);
    box-shadow:inset 0 0 0 3px rgba(255,255,255,0.18), var(--shadow);
    display:flex;align-items:center;justify-content:center;
    color:var(--brass-light);font-family:'Fraunces',serif;font-weight:800;font-size:15px;
    flex-shrink:0;
  }
  .brand h1{font-size:19px;color:var(--green-deep);line-height:1.15;}
  .brand .sub{font-size:12px;color:var(--ink-soft);font-weight:600;letter-spacing:.03em;}
  .role-pill{
    background:var(--green-deep);color:var(--brass-light);
    padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;
    letter-spacing:.03em;text-transform:uppercase;
  }
  .topbar-actions{display:flex;align-items:center;gap:10px;}

  /* ===== Login ===== */
  .login-wrap{display:flex;justify-content:center;padding-top:8vh;}
  .login-card{
    background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:34px 30px 28px;width:100%;max-width:400px;position:relative;
    border:1px solid rgba(20,53,42,0.06);
  }
  .pin{
    position:absolute;top:-9px;left:50%;transform:translateX(-50%);
    width:16px;height:16px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #E8654F, var(--rust) 75%);
    box-shadow:0 3px 5px rgba(0,0,0,0.25);
  }
  .login-header{text-align:center;margin-bottom:22px;}
  .login-header h2{font-size:23px;color:var(--green-deep);}
  .login-header p{font-size:13px;color:var(--ink-soft);margin-top:6px;}
  .role-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;background:rgba(30,77,58,0.07);padding:4px;border-radius:10px;}
  .role-tab{
    flex:1 1 40%;padding:8px 4px;text-align:center;border-radius:7px;font-size:13px;font-weight:600;
    background:transparent;color:var(--ink-soft);
  }
  .role-tab.active{background:var(--green-mid);color:var(--card);}
  .login-error{color:var(--rust);font-size:13px;font-weight:600;margin:-6px 0 12px;}
  .hint{font-size:11.5px;color:var(--ink-soft);margin-top:14px;text-align:center;line-height:1.5;}

  /* ===== Match card ===== */
  .section-title{
    display:flex;align-items:baseline;gap:10px;margin:26px 0 12px;
  }
  .section-title h2{font-size:18px;color:var(--green-deep);}
  .section-title .count{font-size:12px;color:var(--ink-soft);font-weight:600;}
  .empty{
    background:var(--card);border:1.5px dashed var(--line);border-radius:var(--radius);
    padding:30px 20px;text-align:center;color:var(--ink-soft);font-size:14px;
  }
  .match-card{
    background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    margin-bottom:16px;overflow:hidden;border:1px solid rgba(20,53,42,0.06);
  }
  .match-card.past{opacity:.62;}
  .match-head{
    background:linear-gradient(120deg, var(--green-deep), var(--green-mid));
    color:var(--card);padding:14px 18px;display:flex;align-items:center;gap:14px;
  }
  .date-badge{
    width:52px;height:52px;border-radius:50%;flex-shrink:0;
    background:var(--brass);color:var(--green-deep);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace;line-height:1;box-shadow:var(--shadow);
  }
  .date-badge .d{font-size:17px;font-weight:600;}
  .date-badge .m{font-size:9px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;}
  .match-head-info h3{font-size:17px;color:var(--card);}
  .match-head-info .meta{font-size:12.5px;color:var(--brass-light);margin-top:2px;font-weight:500;}
  .match-body{padding:16px 18px 6px;}
  .detail-grid{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:10px 16px;margin-bottom:14px;
  }
  .detail-item .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:700;}
  .detail-item .v{font-size:14px;font-weight:600;color:var(--ink);margin-top:2px;}
  .boundary{
    border:none;border-top:2px dashed var(--line);margin:10px 0 14px;
  }
  .avail-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
  .chip{
    display:flex;align-items:center;gap:7px;background:var(--white);
    border:1.5px solid var(--line);border-radius:20px;padding:5px 6px 5px 10px;font-size:13.5px;font-weight:600;
  }
  .bowl-badge{
    width:20px;height:20px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:700;color:var(--card);
    box-shadow:inset 0 0 0 2px rgba(255,255,255,0.35);
  }
  .bowl-1{background:radial-gradient(circle at 35% 30%, #4C8F6B, var(--green-deep) 75%);}
  .bowl-2{background:radial-gradient(circle at 35% 30%, #5B7FB5, #1F3A5C 75%);}
  .bowl-3{background:radial-gradient(circle at 35% 30%, #8B6BB5, #4A2E63 75%);}
  .bowl-S{background:radial-gradient(circle at 35% 30%, #C98A3F, #7A4A17 75%);}
  .rink-group{margin-bottom:10px;}
  .rink-group h5{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--green-deep);font-weight:700;margin:0 0 6px;}
  .chip .x{
    background:transparent;color:var(--ink-soft);width:18px;height:18px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1;
  }
  .chip .x:hover{background:rgba(156,74,52,0.15);color:var(--rust);}
  .row-actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px;}
  .inline-form{
    background:rgba(30,77,58,0.06);border-radius:10px;padding:14px;margin:10px 0 14px;
  }
  .inline-form .fr{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  .inline-form .fr .field{flex:1;min-width:140px;margin-bottom:0;}
  .pos-choice{display:flex;gap:6px;}
  .pos-btn{
    flex:1;padding:9px 4px;border-radius:8px;border:1.5px solid var(--line);background:var(--white);
    font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:13px;color:var(--ink-soft);
  }
  .pos-btn.active{background:var(--green-mid);border-color:var(--green-mid);color:var(--card);}

  /* selection panel */
  .sel-row{
    display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);
    flex-wrap:wrap;
  }
  .sel-row:last-child{border-bottom:none;}
  .sel-name{flex:1;min-width:110px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;}
  .seg{display:flex;background:var(--white);border:1.5px solid var(--line);border-radius:8px;overflow:hidden;}
  .seg button{padding:7px 10px;font-size:12px;font-weight:600;background:transparent;color:var(--ink-soft);border-right:1px solid var(--line);}
  .seg button:last-child{border-right:none;}
  .seg button.on-playing{background:var(--green-mid);color:var(--card);}
  .seg button.on-reserve{background:var(--rust);color:var(--card);}
  .pos-select{width:64px;padding:7px;font-family:'IBM Plex Mono',monospace;font-weight:700;}

  .teamsheet{
    background:linear-gradient(180deg, rgba(185,139,51,0.10), transparent 40%);
    border:1.5px solid var(--brass-light);border-radius:10px;padding:14px 16px;margin:10px 0 14px;
  }
  .teamsheet h4{font-family:'Fraunces',serif;font-size:15px;color:var(--green-deep);margin:0 0 8px;}
  .ts-list{list-style:none;padding:0;margin:0 0 4px;display:flex;flex-direction:column;gap:6px;}
  .ts-list li{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;}
  .ts-saved{font-size:11px;color:var(--ink-soft);margin-top:8px;}
  .reserve-tag{font-size:10px;font-weight:700;color:var(--rust);text-transform:uppercase;letter-spacing:.03em;}
  .status-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;flex-shrink:0;}
  .status-pending{background:rgba(185,139,51,0.18);color:#7A5A1E;}
  .status-approved{background:rgba(46,110,78,0.15);color:var(--green-deep);}
  .status-rejected{background:rgba(156,74,52,0.15);color:var(--rust);}
  .booking-card{
    background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:14px 16px;margin-bottom:12px;border:1px solid rgba(20,53,42,0.06);
  }
  .booking-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px;}
  .booking-meta{font-size:13px;color:var(--ink-soft);line-height:1.6;}

  /* modal */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(20,38,29,0.55);display:flex;align-items:flex-start;justify-content:center;
    padding:5vh 16px;overflow-y:auto;z-index:50;
  }
  .modal{
    background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    width:100%;max-width:480px;padding:24px 24px 20px;
  }
  .modal h3{font-size:19px;color:var(--green-deep);margin-bottom:16px;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px;}
  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--green-deep);color:var(--card);padding:10px 18px;border-radius:9px;
    font-size:13.5px;font-weight:600;box-shadow:var(--shadow);z-index:80;
  }
  .settings-box{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-top:20px;}
  .storage-note{
    font-size:11.5px;color:var(--ink-soft);text-align:center;margin-top:22px;line-height:1.5;
  }
  @media (max-width:520px){
    .two-col{grid-template-columns:1fr;}
    .match-head{flex-wrap:wrap;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  "use strict";

  const POSITIONS = {"1":{label:"Lead",cls:"bowl-1"}, "2":{label:"Second",cls:"bowl-2"}, "3":{label:"Third",cls:"bowl-3"}, "S":{label:"Skip",cls:"bowl-S"}};
  const MAX_RINKS_FOR_SELECTION = 6;
  const MAX_PLAYERS_PER_RINK = 4;
  function rinkCountForMatch(m){
    const n = Number(m.rinks);
    if(!n || n<1) return MAX_RINKS_FOR_SELECTION;
    return Math.min(n, MAX_RINKS_FOR_SELECTION);
  }
  const todayStr = new Date().toISOString().slice(0,10);

  // This app keeps all data in memory for the browser session only — no platform
  // storage bridge involved, so nothing here can fail the way shared storage did.
  // Use Export / Import (in Admin > Settings) to carry data between sessions on
  // this device.
  const memoryStore = {};
  const storage = {
    async get(key){
      if(!(key in memoryStore)) throw new Error("not found");
      return {key, value: memoryStore[key]};
    },
    async set(key, value){
      memoryStore[key] = value;
      return {key, value};
    },
    async delete(key){
      delete memoryStore[key];
      return {key, deleted:true};
    }
  };

  const state = {
    booted:false,
    role:null,
    loginTab:"player",
    loginPwd:"",
    loginError:"",
    config:null,
    matches:[],
    toast:"",
    modal:null,          // 'addMatch' | 'editMatch'
    modalDraft:null,
    expanded:{},         // matchId -> 'avail' | 'select' | null
    availDraft:{name:"", position:"1"},
    selDraft:null,       // { entryId: {status, position} }
    settingsDraft:null,
    monthFilter:"",
    resetConfirmText:"",
    leagues:null,           // array of 6 {leagueName, teamName, players[]}
    leaguesDraft:null,
    confirmDialog:null,     // {message, resolve}
    club:null,              // {clubName, logoDataUrl, rinkCount}
    clubDraft:null,
    adminPanel:null,        // null | 'hub' | 'branding' | 'rinks' | 'officers' | 'leagues' | 'settings'
    officers:[],            // [{id, role, name, phone, email}]
    officerModal:null,      // 'add' | 'edit'
    officerModalDraft:null,
    mainView:"fixtures",    // 'fixtures' | 'bookings' | 'officers' — not used for committee role
    bookings:[],            // [{id,date,session,rink,requesterName,purpose,status,requestedAt,decidedAt,decidedNote}]
    bookingMonthFilter:"",
    bookingDraft:null,
    rejectTarget:null,      // booking id currently being rejected
    rejectReasonText:"",
    maintenanceSlots:[],    // [{id, day, timeLabel, sessionsBlocked:[], note}]
    maintenanceModal:null,  // 'add' | 'edit'
    maintenanceModalDraft:null,
  };

  function render(){ App.innerHTML = ""; App.appendChild(buildRoot()); }
  const App = document.getElementById("app");

  function showToast(msg){
    state.toast = msg;
    render();
    setTimeout(()=>{ state.toast=""; render(); }, 2200);
  }

  // In-app confirm dialog, used instead of the browser's native confirm() —
  // some preview/embedded environments silently block native confirm/alert
  // popups, which makes destructive actions look like they do nothing.
  function askConfirm(message){
    return new Promise((resolve)=>{
      state.confirmDialog = { message, resolve };
      render();
    });
  }
  function buildConfirmDialog(){
    const { message, resolve } = state.confirmDialog;
    const backdrop = el("div",{class:"modal-backdrop"});
    const modal = el("div",{class:"modal", style:"max-width:380px;"});
    modal.appendChild(el("h3",{style:"font-size:17px;"},["Please confirm"]));
    modal.appendChild(el("p",{style:"font-size:14px;color:var(--ink);line-height:1.5;margin:0 0 18px;"},[message]));
    const actions = el("div",{class:"modal-actions"});
    actions.appendChild(el("button",{class:"btn btn-ghost", onclick:()=>{
      state.confirmDialog = null; resolve(false); render();
    }},["Cancel"]));
    actions.appendChild(el("button",{class:"btn btn-rust", onclick:()=>{
      state.confirmDialog = null; resolve(true); render();
    }},["Confirm"]));
    modal.appendChild(actions);
    backdrop.appendChild(modal);
    return backdrop;
  }

  // ---------- storage helpers ----------
  async function loadConfig(){
    try{
      const r = await storage.get("roles-config");
      return JSON.parse(r.value);
    }catch(e){
      const def = {adminPassword:"3", captainPassword:"2", playerPassword:"1", committeePassword:"4"};
      try{ await storage.set("roles-config", JSON.stringify(def)); }catch(e2){}
      return def;
    }
  }
  async function saveConfig(cfg){
    await storage.set("roles-config", JSON.stringify(cfg));
  }
  function blankLeagues(){
    return Array.from({length:6}, ()=>({leagueName:"", teamName:"", players:[]}));
  }
  async function loadLeagues(){
    try{
      const r = await storage.get("leagues-config");
      const arr = JSON.parse(r.value);
      // pad/truncate defensively to exactly 6 slots
      const out = blankLeagues();
      for(let i=0;i<6;i++) if(arr[i]) out[i] = {leagueName:arr[i].leagueName||"", teamName:arr[i].teamName||"", players:arr[i].players||[]};
      return out;
    }catch(e){
      return blankLeagues();
    }
  }
  async function saveLeagues(arr){
    await storage.set("leagues-config", JSON.stringify(arr));
  }
  function blankClub(){
    return {clubName:"Bowls Club", logoDataUrl:"", rinkCount:4, bookingWindowStart:"", bookingWindowEnd:""};
  }
  async function loadClub(){
    try{
      const r = await storage.get("club-config");
      const c = JSON.parse(r.value);
      return {
        clubName: c.clubName || "Bowls Club",
        logoDataUrl: c.logoDataUrl || "",
        rinkCount: (c.rinkCount>=4 && c.rinkCount<=8) ? c.rinkCount : 4,
        bookingWindowStart: c.bookingWindowStart || "",
        bookingWindowEnd: c.bookingWindowEnd || ""
      };
    }catch(e){
      return blankClub();
    }
  }
  async function saveClub(cfg){
    await storage.set("club-config", JSON.stringify(cfg));
  }
  async function loadMaintenance(){
    try{
      const r = await storage.get("maintenance-list");
      const arr = JSON.parse(r.value);
      return Array.isArray(arr) ? arr : [];
    }catch(e){
      return [];
    }
  }
  async function saveMaintenance(arr){
    await storage.set("maintenance-list", JSON.stringify(arr));
  }
  async function loadOfficers(){
    try{
      const r = await storage.get("officers-list");
      const arr = JSON.parse(r.value);
      return Array.isArray(arr) ? arr : [];
    }catch(e){
      return [];
    }
  }
  async function saveOfficers(arr){
    await storage.set("officers-list", JSON.stringify(arr));
  }
  async function loadBookings(){
    try{
      const r = await storage.get("bookings-list");
      const arr = JSON.parse(r.value);
      return Array.isArray(arr) ? arr : [];
    }catch(e){
      return [];
    }
  }
  async function saveBookings(arr){
    await storage.set("bookings-list", JSON.stringify(arr));
  }
  async function loadIndex(){
    try{
      const r = await storage.get("match-index");
      return JSON.parse(r.value);
    }catch(e){ return []; }
  }
  async function saveIndex(ids){
    await storage.set("match-index", JSON.stringify(ids));
  }
  async function loadMatch(id){
    const r = await storage.get("match:"+id);
    return JSON.parse(r.value);
  }
  async function saveMatch(m){
    await storage.set("match:"+m.id, JSON.stringify(m));
  }
  async function deleteMatchStorage(id){
    try{ await storage.delete("match:"+id); }catch(e){}
    const idx = await loadIndex();
    await saveIndex(idx.filter(x=>x!==id));
  }
  async function resetSeason(){
    const idx = await loadIndex();
    for(const id of idx){
      try{ await storage.delete("match:"+id); }catch(e){ /* continue clearing the rest */ }
    }
    await saveIndex([]);
    state.matches = [];
    state.monthFilter = "";
  }
  async function loadAllMatches(){
    const idx = await loadIndex();
    const out = [];
    for(const id of idx){
      try{ out.push(await loadMatch(id)); }catch(e){}
    }
    out.sort((a,b)=> a.date.localeCompare(b.date));
    return out;
  }

  async function boot(){
    try{
      state.config = await loadConfig();
      state.leagues = await loadLeagues();
      state.club = await loadClub();
      state.officers = await loadOfficers();
      state.bookings = await loadBookings();
      state.maintenanceSlots = await loadMaintenance();
      state.matches = await loadAllMatches();
      if(state.matches.length===0){
        const sample = {
          id: cryptoId(), date: sampleDate(), opponent:"Hatfield Town", homeAway:"Home",
          time:"2:00pm", matchType:"Friendly", kit:"Club",
          rinks:4, format:"Mens triples", captainName:"Pat Fisher", captainContact:"07700 900123",
          availability:[
            {id:cryptoId(), name:"Sam Carter", position:"1"},
            {id:cryptoId(), name:"Jo Bennett", position:"2"},
            {id:cryptoId(), name:"Alex Reid", position:"S"}
          ],
          selection:null
        };
        await saveMatch(sample);
        await saveIndex([sample.id]);
        state.matches = [sample];
      }
      state.bootError = null;
    }catch(err){
      state.bootError = (err && err.message) ? err.message : String(err);
      state.config = state.config || {adminPassword:"3", captainPassword:"2", playerPassword:"1", committeePassword:"4"};

  // ---------- helpers ----------
  function fmtDateBadge(dateStr){
    const dt = new Date(dateStr+"T00:00:00");
    if(isNaN(dt)) return {d:"--", m:"---"};
    return { d: String(dt.getDate()), m: dt.toLocaleString("en-GB",{month:"short"}).toUpperCase() };
  }
  function fmtDateLong(dateStr){
    const dt = new Date(dateStr+"T00:00:00");
    if(isNaN(dt)) return dateStr;
    return dt.toLocaleDateString("en-GB",{weekday:"long", day:"numeric", month:"long", year:"numeric"});
  }
  function el(tag, attrs, children){
    const e = document.createElement(tag);
    if(attrs) for(const k in attrs){
      if(attrs[k]===null || attrs[k]===undefined) continue;
      if(k==="class") e.className = attrs[k];
      else if(k==="html") e.innerHTML = attrs[k];
      else if(k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    (children||[]).forEach(c=>{ if(c) e.appendChild(typeof c==="string"?document.createTextNode(c):c); });
    return e;
  }
  function bowlBadge(pos){
    const p = POSITIONS[pos] || {label:pos, cls:"bowl-1"};

  async function saveLeagueSlot(i){
    const d = state.leaguesDraft[i];
    const players = d.playersText.split(/[\n,;]+/).map(s=>s.trim()).filter(Boolean);
    const full = state.leagues.map((l,idx)=> idx===i
      ? {leagueName:d.leagueName.trim(), teamName:d.teamName.trim(), players}
      : l);
    try{
      await saveLeagues(full);
      state.leagues = full;
      showToast(d.leagueName.trim() ? "\""+d.leagueName.trim()+"\" saved." : "League "+(i+1)+" cleared.");
    }catch(err){
      console.error(err);
      showToast("Could not save: "+(err.message||err));
    }
  }

  // ---------- RINK BOOKING ----------
  const SESSIONS = ["Morning","Afternoon","Evening"];
  const DAY_ORDER = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

  function blankBookingDraft(){
    return {date:todayStr, session:"Morning", rink:"1", requesterName:"", purpose:""};
  }
  function hasApprovedClash(bookings, date, session, rink, excludeId){
    return bookings.some(b=> b.id!==excludeId && b.date===date && b.session===session && String(b.rink)===String(rink) && b.status==="approved");
  }
  function weekdayName(dateStr){
    const dt = new Date(dateStr+"T00:00:00");
    if(isNaN(dt)) return "";
    return DAY_ORDER[(dt.getDay()+6)%7]; // getDay(): 0=Sun..6=Sat -> shift so Monday=0
  }
  function maintenanceClash(dateStr, session){
    const day = weekdayName(dateStr);
    return state.maintenanceSlots.find(slot=> slot.day===day && slot.sessionsBlocked.includes(session)) || null;
  }

  function buildBookingTab(){
    const wrap = el("div",{});
    if(state.maintenanceSlots.length){
      const box = el("div",{style:"background:rgba(30,77,58,0.06);border-radius:10px;padding:12px 14px;margin-bottom:18px;"});
      box.appendChild(el("div",{style:"font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:700;margin-bottom:6px;"},
        ["Weekly rink maintenance"]));
      [...state.maintenanceSlots].sort((a,b)=>DAY_ORDER.indexOf(a.day)-DAY_ORDER.indexOf(b.day)).forEach(slot=>{
        box.appendChild(el("div",{style:"font-size:13px;color:var(--ink);line-height:1.6;"},
          ["Every "+slot.day+(slot.timeLabel?" "+slot.timeLabel:"")+" — "+slot.sessionsBlocked.join(", ")+(slot.note?" ("+slot.note+")":"")]));
      });
      wrap.appendChild(box);
    }
    wrap.appendChild(buildBookingRequestForm());
    wrap.appendChild(buildBookingListSection());
    return wrap;
  }

      el("input",{type:"text", value:d.purpose, placeholder:"e.g. Practice, coaching, friendly roll-up",
        oninput:(e)=>{ d.purpose=e.target.value; }})
    ]));

    if(hasApprovedClash(state.bookings, d.date, d.session, d.rink, null)){
      box.appendChild(el("div",{style:"font-size:12.5px;color:var(--rust);font-weight:600;margin-bottom:10px;"},
        ["Rink "+d.rink+" is already approved for that date and session — pick another rink or time, or submit anyway and let the committee sort it out."]));
    }
    const maintClash = maintenanceClash(d.date, d.session);
    if(maintClash){
      box.appendChild(el("div",{style:"font-size:12.5px;color:var(--rust);font-weight:600;margin-bottom:10px;"},
        ["That's during weekly maintenance (every "+maintClash.day+(maintClash.timeLabel?" "+maintClash.timeLabel:"")+
        (maintClash.note?", "+maintClash.note:"")+") — this session can't be requested then."]));
    }

    box.appendChild(el("button",{class:"btn btn-primary", onclick:submitBookingRequest},["Request booking"]));
    return box;

  async function submitBookingRequest(){
    const d = state.bookingDraft;
    if(!d.requesterName.trim()){ showToast("Enter your name first."); return; }
    if(!d.date){ showToast("Choose a date."); return; }
    if(state.club.bookingWindowStart && d.date < state.club.bookingWindowStart){
      showToast("Bookings don't open until "+fmtDateLong(state.club.bookingWindowStart)+"."); return;
    }
    if(state.club.bookingWindowEnd && d.date > state.club.bookingWindowEnd){
      showToast("Bookings close after "+fmtDateLong(state.club.bookingWindowEnd)+"."); return;
    }
    const clash = maintenanceClash(d.date, d.session);
    if(clash){
      showToast("That's during weekly maintenance (every "+clash.day+(clash.timeLabel?" "+clash.timeLabel:"")+") — pick a different session or date."); return;
    }
    const booking = {
      id: cryptoId(), date:d.date, session:d.session, rink:d.rink,
      requesterName:d.requesterName.trim(), purpose:d.purpose.trim(),
      status:"pending", requestedAt:new Date().toISOString(), decidedAt:null, decidedNote:""
    };
    const before = state.bookings;
    const updated = [...state.bookings, booking];
    try{
      await saveBookings(updated);
      state.bookings = updated;
      state.bookingDraft = blankBookingDraft();
      showToast("Booking requested — waiting for committee approval.");
    }catch(err){
      console.error(err);
      state.bookings = before;
      showToast("Could not save: "+(err.message||err));
    }
  }

        oninput:(e)=>{ state.rejectReasonText = e.target.value; }})
    ]));
    const actions = el("div",{class:"modal-actions"});
    actions.appendChild(el("button",{class:"btn btn-ghost", onclick:closeRejectModal},["Cancel"]));
    actions.appendChild(el("button",{class:"btn btn-rust", onclick:submitReject},["Reject booking"]));
    modal.appendChild(actions);
    backdrop.appendChild(modal);
    return backdrop;
  }
  async function submitReject(){
    const id = state.rejectTarget;
    const note = state.rejectReasonText.trim();
    const before = state.bookings;
    const updated = state.bookings.map(x=> x.id===id ? {...x, status:"rejected", decidedAt:new Date().toISOString(), decidedNote:note} : x);
    try{
      await saveBookings(updated);
      state.bookings = updated;
      closeRejectModal();
      showToast("Booking rejected.");
    }catch(err){
      console.error(err);
      state.bookings = before;
      showToast("Could not save: "+(err.message||err));
    }
  }

  // ---------- MATCH LIST ----------
  function buildMatchList(){
    const wrap = el("div",{});
    const months = monthOptions(state.matches);
    const filtered = state.monthFilter
      ? state.matches.filter(m=> m.date.slice(0,7)===state.monthFilter)
      : state.matches;

    wrap.appendChild(el("div",{class:"section-title"},[
      el("h2",{},["Fixtures"]),
      el("span",{class:"count"},[filtered.length+" match"+(filtered.length===1?"":"es")+(state.monthFilter?" in "+monthLabel(state.monthFilter):"")])
    ]));

    if(months.length>1){
      const filterRow = el("div",{style:"display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;"});
      filterRow.appendChild(el("label",{style:"margin:0;flex-shrink:0;"},["Show"]));
      const sel = el("select",{style:"max-width:220px;", onchange:(e)=>{ state.monthFilter = e.target.value; render(); }});
      sel.appendChild(el("option",{value:"", selected: state.monthFilter===""?"selected":null},["All fixtures"]));
      months.forEach(ym=> sel.appendChild(el("option",{value:ym, selected: state.monthFilter===ym?"selected":null},[monthLabel(ym)])));
      filterRow.appendChild(sel);
      wrap.appendChild(filterRow);
    }

    if(filtered.length===0){
      wrap.appendChild(el("div",{class:"empty"},[
        state.matches.length===0
          ? (state.role==="admin" ? "No fixtures yet — add the first one below." : "No fixtures have been posted yet.")
          : "No fixtures in "+monthLabel(state.monthFilter)+"."
      ]));
      return wrap;
    }
    filtered.forEach(m=> wrap.appendChild(buildMatchCard(m)));
    return wrap;
  }
  function monthOptions(matches){
    const set = new Set(matches.map(m=>m.date.slice(0,7)));
    return Array.from(set).sort();
  }
  function monthLabel(ym){
    const dt = new Date(ym+"-01T00:00:00");
    if(isNaN(dt)) return ym;
    return dt.toLocaleDateString("en-GB",{month:"long", year:"numeric"});
  }

    const head = el("div",{class:"match-head"},[
      el("div",{class:"date-badge"},[el("div",{class:"d"},[badge.d]), el("div",{class:"m"},[badge.m])]),

        el("h3",{},[(m.homeAway==="Home"?"vs ":"at ")+m.opponent]),
        el("div",{class:"meta"},[fmtDateLong(m.date)+(m.time?" · "+m.time:"")])
      ])
    ]);
    if(state.role==="admin"){
      const adminBtns = el("div",{style:"display:flex;gap:6px;flex-shrink:0;"});
      adminBtns.appendChild(el("button",{class:"btn btn-sm", style:"background:rgba(255,255,255,0.16);color:var(--card);",
        onclick:()=>openEditMatch(m)},["Edit"]));
      adminBtns.appendChild(el("button",{class:"btn btn-sm", style:"background:rgba(156,74,52,0.55);color:var(--card);",
        onclick:()=>confirmDeleteMatch(m)},["Delete"]));

    }
    card.appendChild(head);

    const body = el("div",{class:"match-body"});
    const league = matchLeague(m);
    const gridItems = [
      detailItem("Home / Away", m.homeAway),

      detailItem("Rinks", String(m.rinks||"—")),
      detailItem("Format", m.format || "—"),
      detailItem("Match captain", m.captainName ? (m.captainName + (m.captainContact? " ("+m.captainContact+")" : "")) : "—"),
    ];

    // availability

    }else{
      const list = el("div",{class:"avail-list"});
      m.availability.forEach(a=>{
        const chip = el("span",{class:"chip"},[bowlBadge(a.position), el("span",{},[a.name])]);
        if(state.role==="player" || state.role==="admin"){
          chip.appendChild(el("button",{class:"x", title:"Remove", onclick:()=>removeAvailability(m,a.id)},["✕"]));
        }
        list.appendChild(chip);
      });

    // team sheet if selection exists
    if(m.selection){
      body.appendChild(buildTeamSheet(m));
    }

    // role actions
    const rowActions = el("div",{class:"row-actions"});
    if(state.role==="player"){
      const isOpen = state.expanded[m.id]==="avail";
      rowActions.appendChild(el("button",{class:"btn btn-ghost btn-sm", onclick:()=>{
        state.expanded[m.id] = isOpen? null : "avail";
        state.availDraft = {name:"", position:"1"};
        render();
      }},[isOpen? "Cancel" : "Put my name down"]));
    }
    if(state.role==="captain"){
      const isOpen = state.expanded[m.id]==="select";
      rowActions.appendChild(el("button",{class:"btn btn-brass btn-sm", onclick:()=>{
        if(isOpen){ state.expanded[m.id]=null; state.selDraft=null; }
        else{ state.expanded[m.id]="select"; state.selDraft = buildSelDraft(m); }
        render();
      }},[isOpen? "Close selection" : (m.selection? "Edit selection" : "Select team")]));
    }
    if(rowActions.childNodes.length) body.appendChild(rowActions);

    if(state.role==="player" && state.expanded[m.id]==="avail"){
      body.appendChild(buildAvailForm(m));

    if(state.role==="captain" && state.expanded[m.id]==="select"){
      body.appendChild(buildSelectPanel(m));
    }

    card.appendChild(body);

  async function addAvailability(m){
    const name = state.availDraft.name.trim();
    if(!name){ showToast("Enter your name first."); return; }
    const entry = {id: cryptoId(), name, position: state.availDraft.position};
    m.availability.push(entry);
    try{
      await saveMatch(m);
      state.expanded[m.id] = null;
      showToast("Added "+name+" to the availability list.");
    }catch(err){
      console.error(err);
      m.availability = m.availability.filter(a=>a.id!==entry.id);
      showToast("Could not save: "+(err.message||err));
    }
  }
  async function removeAvailability(m, entryId){
    const entry = m.availability.find(a=>a.id===entryId);
    if(!(await askConfirm("Remove "+(entry?entry.name:"this entry")+" from availability?"))) return;
    const before = m.availability;
    m.availability = m.availability.filter(a=>a.id!==entryId);
    try{
      await saveMatch(m);
      showToast("Removed from availability.");
    }catch(err){
      console.error(err);
      m.availability = before;
      showToast("Could not save: "+(err.message||err));
    }
  }

  // ---------- CAPTAIN selection ----------
  function buildSelDraft(m){
    const d = {};
    m.availability.forEach(a=>{
      let status="none", position=a.position, rink="1";
      if(m.selection){
        const inPlayers = m.selection.players.find(p=>p.name===a.name);
        const inReserve = m.selection.reserves.find(p=>p.name===a.name);
        if(inPlayers){ status="playing"; position=inPlayers.position; rink=inPlayers.rink||"1"; }
        else if(inReserve){ status="reserve"; position=inReserve.position; rink=inReserve.rink||"1"; }
      }
      d[a.id] = {status, position, rink};
    });
    return d;
  }

  function buildSelectPanel(m){
    const box = el("div",{class:"inline-form"});
    if(m.availability.length===0){
      box.appendChild(el("div",{style:"font-size:13.5px;color:var(--ink-soft);"},["No players are available yet — nothing to select."]));
      return box;
    }
    const rinkCount = rinkCountForMatch(m);
    box.appendChild(el("div",{style:"font-size:12px;color:var(--ink-soft);margin-bottom:10px;"},
      ["Up to "+rinkCount+" game"+(rinkCount===1?"":"s")+", "+MAX_PLAYERS_PER_RINK+" players per game."]));
    m.availability.forEach(a=>{
      const d = state.selDraft[a.id];
      const row = el("div",{class:"sel-row"});
      row.appendChild(el("div",{class:"sel-name"},[bowlBadge(a.position), el("span",{},[a.name])]));
      const seg = el("div",{class:"seg"});
      seg.appendChild(el("button",{class:d.status==="none"?"":"", onclick:()=>{ d.status="none"; render(); }},["—"]));
      seg.appendChild(el("button",{class:d.status==="playing"?"on-playing":"", onclick:()=>{ d.status="playing"; render(); }},["Playing"]));
      seg.appendChild(el("button",{class:d.status==="reserve"?"on-reserve":"", onclick:()=>{ d.status="reserve"; render(); }},["Reserve"]));
      row.appendChild(seg);
      const posSel = el("select",{class:"pos-select", onchange:(e)=>{ d.position = e.target.value; }});
      Object.keys(POSITIONS).forEach(p=>{
        posSel.appendChild(el("option",{value:p, selected: d.position===p ? "selected": null},[p]));
      });
      row.appendChild(posSel);
      const rinkSel = el("select",{class:"pos-select", style:"width:88px;", onchange:(e)=>{ d.rink = e.target.value; }});
      for(let n=1;n<=rinkCount;n++){
        rinkSel.appendChild(el("option",{value:String(n), selected: d.rink===String(n)?"selected":null},["Game "+n]));
      }
      row.appendChild(rinkSel);
      box.appendChild(row);
    });
    const saveRow = el("div",{style:"display:flex;justify-content:flex-end;margin-top:12px;"});
    saveRow.appendChild(el("button",{class:"btn btn-brass btn-sm", onclick:()=>saveSelection(m)},["Save team sheet"]));
    box.appendChild(saveRow);
    return box;
  }

  async function saveSelection(m){
    const players=[], reserves=[];
    m.availability.forEach(a=>{
      const d = state.selDraft[a.id];
      if(d.status==="playing") players.push({name:a.name, position:d.position, rink:d.rink||"1"});
      else if(d.status==="reserve") reserves.push({name:a.name, position:d.position, rink:d.rink||"1"});
    });
    if(players.length===0){ if(!(await askConfirm("No players marked as Playing — save anyway?"))) return; }
    const counts = {};
    players.forEach(p=>{ counts[p.rink] = (counts[p.rink]||0)+1; });
    const overfull = Object.keys(counts).filter(r=>counts[r]>MAX_PLAYERS_PER_RINK);
    if(overfull.length){
      const list = overfull.map(r=>"Game "+r+" has "+counts[r]).join(", ");
      if(!(await askConfirm(list+" — more than "+MAX_PLAYERS_PER_RINK+" players per game. Save anyway?"))) return;
    }
    const before = m.selection;
    m.selection = {players, reserves, savedAt: new Date().toISOString()};
    try{
      await saveMatch(m);
      state.expanded[m.id] = null;
      state.selDraft = null;
      showToast("Team sheet saved.");
    }catch(err){
      console.error(err);
      m.selection = before;
      showToast("Could not save: "+(err.message||err));
    }
  }

  function fieldInput(label,key,value,type,placeholder,draft){

      el("label",{},[label]),

    return el("div",{class:"field"},[el("label",{},[label]), sel]);

  function closeModal(){ state.modal=null; state.modalDraft=null; render(); }

  async function submitModal(isEdit){
    const d = state.modalDraft;
    if(!d.opponent.trim()){ showToast("Enter the opponent club."); return; }
    if(!d.date){ showToast("Enter the match date."); return; }
    try{
      if(isEdit){
        const m = state.matches.find(x=>x.id===d.id);
        const before = {...m};
        Object.assign(m, {date:d.date, opponent:d.opponent.trim(), homeAway:d.homeAway, time:d.time,
          matchType:d.matchType, kit:d.kit, rinks:Number(d.rinks)||0, format:d.format,
          captainName:d.captainName.trim(), captainContact:d.captainContact.trim(),
          leagueId: d.leagueId===""? null : Number(d.leagueId)});
        try{
          await saveMatch(m);
        }catch(err){
          Object.assign(m, before);
          throw err;
        }
        state.matches.sort((a,b)=>a.date.localeCompare(b.date));
        showToast("Fixture updated.");
      }else{
        const m = {id:cryptoId(), date:d.date, opponent:d.opponent.trim(), homeAway:d.homeAway, time:d.time,
          matchType:d.matchType, kit:d.kit, rinks:Number(d.rinks)||0, format:d.format,
          captainName:d.captainName.trim(), captainContact:d.captainContact.trim(),
          leagueId: d.leagueId===""? null : Number(d.leagueId),
          availability:[], selection:null};
        await saveMatch(m);
        const idx = await loadIndex();
        idx.push(m.id);
        await saveIndex(idx);
        state.matches.push(m);
        state.matches.sort((a,b)=>a.date.localeCompare(b.date));
        showToast("Fixture added.");
      }
      closeModal();
    }catch(err){
      console.error(err);
      showToast("Could not save the fixture: "+(err.message||err));
    }
  }

  function exportData(){
    const payload = {
      exportedAt: new Date().toISOString(),
      config: state.config,
      leagues: state.leagues,
      club: state.club,
      officers: state.officers,
      bookings: state.bookings,
      maintenanceSlots: state.maintenanceSlots,
      matches: state.matches
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "bowls-availability-backup-"+todayStr+".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast("Backup file downloaded.");
  }

  async function importData(file){
    let payload;
    try{
      const text = await file.text();
      payload = JSON.parse(text);
    }catch(err){
      showToast("That file doesn't look like a valid backup.");
      return;
    }
    if(!payload || !Array.isArray(payload.matches)){
      showToast("That file doesn't look like a valid backup.");
      return;
    }
    if(!(await askConfirm("Import this backup? It will replace everything currently shown (fixtures, availability, team sheets, leagues and passwords)."))) return;

    const config = payload.config && payload.config.adminPassword
      ? {adminPassword:payload.config.adminPassword, captainPassword:payload.config.captainPassword||"2",
         playerPassword:payload.config.playerPassword||"1", committeePassword:payload.config.committeePassword||"4"}
      : {adminPassword:"3", captainPassword:"2", playerPassword:"1", committeePassword:"4"};
    const club = (payload.club && payload.club.clubName)
      ? {clubName: payload.club.clubName, logoDataUrl: payload.club.logoDataUrl||"",
         rinkCount: (payload.club.rinkCount>=4 && payload.club.rinkCount<=8) ? payload.club.rinkCount : 4,
         bookingWindowStart: payload.club.bookingWindowStart||"", bookingWindowEnd: payload.club.bookingWindowEnd||""}
      : blankClub();
    const officers = Array.isArray(payload.officers)
      ? payload.officers.filter(o=>o && o.role && o.name).map(o=>({id:o.id||cryptoId(), role:o.role||"", name:o.name||"", phone:o.phone||"", email:o.email||""}))
      : [];
    const bookings = Array.isArray(payload.bookings)
      ? payload.bookings.filter(b=>b && b.date).map(b=>({
          id:b.id||cryptoId(), date:b.date, session:b.session||"Morning", rink:b.rink||"1",
          requesterName:b.requesterName||"", purpose:b.purpose||"",
          status: ["pending","approved","rejected"].includes(b.status) ? b.status : "pending",
          requestedAt:b.requestedAt||new Date().toISOString(), decidedAt:b.decidedAt||null, decidedNote:b.decidedNote||""
        }))
      : [];
    const maintenanceSlots = Array.isArray(payload.maintenanceSlots)
      ? payload.maintenanceSlots.filter(s=>s && DAY_ORDER.includes(s.day)).map(s=>({
          id:s.id||cryptoId(), day:s.day, timeLabel:s.timeLabel||"",
          sessionsBlocked: Array.isArray(s.sessionsBlocked) ? s.sessionsBlocked.filter(x=>SESSIONS.includes(x)) : [],
          note:s.note||""
        }))
      : [];
    const leagues = blankLeagues();
    if(Array.isArray(payload.leagues)){
      for(let i=0;i<6;i++) if(payload.leagues[i]) leagues[i] = {
        leagueName: payload.leagues[i].leagueName||"", teamName: payload.leagues[i].teamName||"", players: payload.leagues[i].players||[]
      };
    }
    const matches = payload.matches.map(m=>({
      id: m.id || cryptoId(), date:m.date, opponent:m.opponent||"", homeAway:m.homeAway||"Home",
      time:m.time||"", matchType:m.matchType||"", kit:m.kit||"Club",
      rinks:m.rinks||0, format:m.format||"", captainName:m.captainName||"", captainContact:m.captainContact||"",
      leagueId: (m.leagueId===0||m.leagueId) ? m.leagueId : null,
      availability: m.availability||[], selection: m.selection||null
    })).sort((a,b)=>a.date.localeCompare(b.date));

    try{
      await saveConfig(config);
      await saveLeagues(leagues);
      await saveClub(club);
      await saveOfficers(officers);
      await saveBookings(bookings);
      await saveMaintenance(maintenanceSlots);
      for(const m of matches) await saveMatch(m);
      await saveIndex(matches.map(m=>m.id));
      state.config = config;
      state.leagues = leagues;
      state.club = club;
      state.officers = officers;
      state.bookings = bookings;
      state.maintenanceSlots = maintenanceSlots;
      state.matches = matches;
      state.settingsDraft = null;
      state.leaguesDraft = null;
      state.clubDraft = null;
      document.title = state.club.clubName + " — Availability & Selection";
      showToast("Backup imported — "+matches.length+" fixture"+(matches.length===1?"":"s")+" loaded.");
    }catch(err){
      console.error(err);
      showToast("Could not import: "+(err.message||err));
    }
  }

  function cryptoId(){
    if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "id-"+Date.now()+"-"+Math.random().toString(16).slice(2);
  }

  boot();
})();
</script>
</body>
</html>
